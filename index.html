            [1.02 + dx, -1.0, 3.9 * h],
            [0.08 + dx, -1.0, 5.15 * h],
            "v",
          ); // neck
          v += vseg(
            [0.08 + dx, -1.0, 5.15 * h],
            [-0.06 + dx, -1.0, 5.42 * h],
            "v",
          ); // headstock
          v += vpline(
            [
              [rightHandX, -1.1, bodT - 0.2],
              [1.3 + dx - lean * 0.06, -0.95, 4.35 * h],
              ext(
                [1.3 + dx - lean * 0.06, -0.95, 4.35 * h],
                [1.5 + dx, -0.85, 3.85 * h],
                1.35,
              ),
            ],
            "v",
          ); // strum arm
          v += vpline(
            [
              [leftHandX, -1.1, bodT - 0.3],
              [0.28 + dx - lean * 0.1, -1.0, 4.55 * h],
              ext(
                [0.28 + dx - lean * 0.1, -1.0, 4.55 * h],
                [0.32 + dx, -0.9, 4.85 * h],
                1.45,
              ),
            ],
            "v",
          ); // fret arm
          notePos = T([1.35 + dx, -0.9, 4.35 * h]);
        } else if (instr === "on flute") {
          v += vseg(
            [0.82 + dx, -0.95, 5.6 * h],
            [1.95 + dx, -0.72, 5.45 * h],
            "v",
          ); // flute
          v += vseg(
            [1.92 + dx, -0.74, 5.55 * h],
            [1.98 + dx, -0.7, 5.36 * h],
            "v",
          ); // end cap
          v += vpline(
            [
              [leftHandX, -1.1, bodT - 0.3],
              [0.75 + dx - lean * 0.05, -0.98, 4.9 * h],
              [1.15 + dx, -0.85, 5.45 * h],
            ],
            "v",
          ); // hand near
          v += vpline(
            [
              [rightHandX, -1.1, bodT - 0.2],
              [1.25 + dx - lean * 0.05, -0.95, 4.85 * h],
              [1.6 + dx, -0.8, 5.4 * h],
            ],
            "v",
          ); // hand far
          notePos = T([2.0 + dx, -0.7, 6.0 * h]);
        } else if (instr === "on violin" || instr === "on e-violin") {
          const open =
            instr === "on e-violin"
              ? '<g style="color:' +
                pick(visPalette().filter((c) => c !== col)) +
                '">'
              : "";
          v += open;
          if (instr === "on violin") {
            v += vcircY(-0.95, 0.5 + dx, 5.45 * h, 0.32, "v"); // body
          } else {
            v += vpline(
              [
                [0.82 + dx, -0.95, 5.25 * h],
                [0.28 + dx, -0.95, 5.3 * h],
                [0.6 + dx, -0.95, 5.7 * h],
                [0.82 + dx, -0.95, 5.55 * h],
              ],
              "v",
            );
          }
          v += vseg(
            [0.3 + dx, -0.95, 5.6 * h],
            [-0.5 + dx, -0.95, 6.12 * h],
            "v",
          ); // neck
          v += vseg(
            [-0.5 + dx, -0.95, 6.12 * h],
            [-0.64 + dx, -0.95, 6.0 * h],
            "v",
          ); // scroll
          if (open) v += "</g>";
          v += vseg(
            [1.05 + dx, -0.85, 4.95 * h],
            [0.12 + dx, -0.85, 5.95 * h],
            "v",
          ); // bow
          v += vpline(
            [
              [rightHandX, -1.1, bodT - 0.2],
              [1.15 + dx - lean * 0.05, -0.98, 4.55 * h],
              [0.95 + dx, -0.82, 5.05 * h],
            ],
            "v",
          ); // bow arm
          v += vpline(
            [
              [leftHandX, -1.1, bodT - 0.3],
              [0.05 + dx - lean * 0.05, -1.0, 5.2 * h],
              [-0.32 + dx, -0.9, 5.92 * h],
            ],
            "v",
          ); // neck arm
          notePos = T([0.35 + dx, -0.9, 6.35 * h]);
        } else if (instr === "on sax") {
          v += vbez(
            [0.98 + dx, -0.86, 5.65 * h],
            [1.18 + dx, -0.8, 4.6 * h],
            [1.32 + dx, -0.8, 4.15 * h],
            "v",
          ); // tube down
          v += vbez(
            [1.32 + dx, -0.8, 4.15 * h],
            [1.62 + dx, -0.8, 4.05 * h],
            [1.68 + dx, -0.8, 4.5 * h],
            "v",
          ); // bell curve
          v += vcircY(-0.8, 1.68 + dx, 4.62 * h, 0.2, "v"); // bell
          v += vpline(
            [
              [leftHandX, -1.1, bodT - 0.3],
              [0.7 + dx - lean * 0.05, -0.98, 4.5 * h],
              [1.05 + dx, -0.85, 4.95 * h],
            ],
            "v",
          ); // hand high
          v += vpline(
            [
              [rightHandX, -1.1, bodT - 0.2],
              [1.15 + dx - lean * 0.05, -0.98, 4.1 * h],
              ext(
                [1.15 + dx - lean * 0.05, -0.98, 4.1 * h],
                [1.28 + dx, -0.85, 4.45 * h],
                1.4,
              ),
            ],
            "v",
          ); // hand low
          notePos = T([1.7 + dx, -0.75, 5.15 * h]);
        } else {
          // on the mic — always one hand on the mic; the free arm gets a simple random gesture
          const micShoulder = [leftHandX, -1.1, bodT - 0.28];
          const micElbow = [0.34 + dx + lean * 0.08, -1.02, 4.42 * h];
          const micHand = [0.92 + dx + lean * 0.16, -0.56, 5.58 * h];
          const freeArmMode = pick(["wave", "side", "walk"]);
          const freeShoulder = [rightHandX, -1.1, bodT - 0.22];
          let freeElbow, freeHand;
          if (freeArmMode === "wave") {
            freeElbow = [1.72 + dx + lean * 0.16, -1.0, 4.58 * h];
            freeHand = [1.42 + dx + lean * 0.18, -0.82, 5.98 * h];
          } else if (freeArmMode === "side") {
            freeElbow = [1.74 + dx + lean * 0.14, -1.06, 4.38 * h];
            freeHand = [1.86 + dx + lean * 0.08, -1.12, 3.55 * h];
          } else {
            freeElbow = [1.76 + dx + lean * 0.16, -1.02, 4.5 * h];
            freeHand = ext(
              freeElbow,
              [1.64 + dx + lean * 0.12, -0.98, 4.18 * h],
              1.45,
            );
          }
          v += vpline([micShoulder, micElbow, micHand], "v"); // longer, simple bent arm that really reaches the mic
          const fp = iso(...T(freeShoulder));
          v +=
            '<g class="vFreeArm" data-mode="' +
            freeArmMode +
            '" data-px="' +
            fp[0].toFixed(1) +
            '" data-py="' +
            fp[1].toFixed(1) +
            '">' +
            vpline([freeShoulder, freeElbow, freeHand], "v") +
            "</g>";
          const hp = iso(...T(micHand)); // main hand pivot (screen px)
          micPh = Math.random() < 0.22 ? Math.random() : -1; // -1 = holds it properly
          const mL = 18 * VS,
            mA = (-38 * Math.PI) / 180; // horizontal-ish, aimed at the mouth
          const mtx = hp[0] + Math.cos(mA) * mL,
            mty = hp[1] + Math.sin(mA) * mL;
          v +=
            '<g class="gMicHold" style="color:var(--cyan)" data-px="' +
            hp[0].toFixed(1) +
            '" data-py="' +
            hp[1].toFixed(1) +
            '" data-ph="' +
            micPh.toFixed(3) +
            '">' +
            '<line class="v" x1="' +
            hp[0].toFixed(1) +
            '" y1="' +
            hp[1].toFixed(1) +
            '" x2="' +
            mtx.toFixed(1) +
            '" y2="' +
            mty.toFixed(1) +
            '"/>' +
            '<circle class="v" cx="' +
            mtx.toFixed(1) +
            '" cy="' +
            mty.toFixed(1) +
            '" r="' +
            (4.4 * VS).toFixed(1) +
            '"/>' +
            "</g>";
          notePos = T([0.97 + dx + lean * 0.18, -0.48, 6.9 * h]);
        }
        target.innerHTML = v;
        target.style.color = col;
        const headAnchor = iso(
          ...T([headCX, -1.1, headZ + shoulderRise * 0.25 + 1.05]),
        ),
          dna = guestDNA(),
          voiceProfile = buildPerformerVoice({
            voiceKind: arche.voiceKind,
            age,
            height: h,
            bodyW,
            dna,
          }),
          speechVoice = makeGuestSpeechVoice(
            arche.voiceKind,
            age,
            dna,
            voiceProfile,
          );
        return {
          instr,
          color: col,
          notePos,
          voiceKind: arche.voiceKind,
          archetype: arche.kind,
          age,
          height: h,
          bodyW,
          micPh,
          headAnchor,
          dna,
          voiceProfile,
          speechVoice,
        };
      }
      function ensureVisitorVoiceContrast(visitor, against) {
        if (
          !visitor ||
          !against ||
          visitor.voiceProfile?.key !== against.voiceProfile?.key
        )
          return visitor;
        visitor.voiceProfile = buildPerformerVoice({
          voiceKind: visitor.voiceKind,
          age: visitor.age,
          height: visitor.height,
          bodyW: visitor.bodyW,
          dna: visitor.dna,
          forcedKey: contrastingVoiceKey(visitor.voiceProfile.key),
        });
        visitor.speechVoice = makeGuestSpeechVoice(
          visitor.voiceKind,
          visitor.age,
          visitor.dna,
          visitor.voiceProfile,
        );
        return visitor;
      }
      vis1 = buildVisitor(gVis, "on the mic", 0); // pre-built so the viewBox
      vis2 = ensureVisitorVoiceContrast(
        buildVisitor(gVis2, "on acoustic", -2.35),
        vis1,
      ); // reserves space for a duo
      const world = document.getElementById("world");
      let kickE = 0,
        snareE = 0,
        hatE = 0;
      const reduceMotion = matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;
      const mobileVisual30 = matchMedia("(max-width: 640px)").matches;
      const visualFrameInterval = 1000 / 30;
      let lastVisualFrame = 0;
      let lastMetaUpdate = -Infinity;
      let cachedMicHolds = [];
      let cachedMicState = "";
      const guestMotionCache = new WeakMap();

      function getMicHoldEls() {
        const state = `${visitor ? 1 : 0}${visitor2 ? 1 : 0}`;
        if (
          state !== cachedMicState ||
          cachedMicHolds.some((el) => !el.isConnected)
        ) {
          cachedMicState = state;
          cachedMicHolds = visitor || visitor2
            ? Array.from(document.querySelectorAll(".gMicHold"))
            : [];
        }
        return cachedMicHolds;
      }

      function getGuestMotionParts(group) {
        let parts = guestMotionCache.get(group);
        if (
          !parts ||
          !parts.legA?.isConnected ||
          !parts.legB?.isConnected
        ) {
          parts = {
            legA: group.querySelector(".wlegA"),
            legB: group.querySelector(".wlegB"),
            freeArm: group.querySelector(".vFreeArm"),
          };
          guestMotionCache.set(group, parts);
        }
        return parts;
      }

      const SPK = [
        [3.6, 3.45, 3.9],
        [10.0, 3.45, 3.9],
        [8.75, -3.4, 5.45],
      ]; // rig speakers + rear backpack cone; the lower-left cone spawned notes that drifted up under a.r.i.'s headset mic
      const keyEls = [...Array(9)].map((_, i) =>
        document.getElementById("key" + i),
      );
      const gWheelSpin = document.getElementById("gWheelSpin");
      const WC = iso(3.3, 1.2, ZT + 0.02); // wheel center (screen)
      function flashChord() {
        const i = RI(0, 4);
        [i, i + 2, i + 4].forEach((k) => {
          const el = keyEls[k];
          if (!el) return;
          el.classList.add("on");
          setTimeout(() => el.classList.remove("on"), 200 + RI(0, 120));
        });
      }
      function spawnNote(pos, cls, color) {
        if (reduceMotion) return;
        const [x, y] = iso(...(pos || [6.9, -0.6, 9.9]));
        const t = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text",
        );
        t.setAttribute("x", x + R(-8, 10));
        t.setAttribute("y", y);
        t.setAttribute("class", "note " + (cls || "") + " go");
        if (color) t.style.fill = color;
        t.textContent = pick(["♪", "♫", "♩"]);
        world.appendChild(t);
        setTimeout(() => t.remove(), 2300);
      }
      function flashPad() {
        const p = document.getElementById("pad" + RI(0, 11));
        if (!p) return;
        p.style.fill = "rgba(167,139,255,.55)";
        setTimeout(() => (p.style.fill = "rgba(167,139,255,0)"), 120);
      }

      function frame(frameNow) {
        requestAnimationFrame(frame);
        if (!ctx) return;
        const now = ctx.currentTime;
        while (visQ.length && visQ[0].t <= now) {
          const e = visQ.shift();
          if (now - e.t > 0.4) continue; // stale (we were backgrounded) — skip without firing
          if (e.type === "kick") {
            kickE = 1;
            eqVal[0] = 1;
            eqVal[1] = 0.85;
            if (Math.random() < 0.16) spawnNote(pick(SPK), "sp");
          }
          if (e.type === "snare") {
            snareE = 1;
            eqVal[2] = 0.9;
            eqVal[3] = 1;
            eqVal[4] = 0.8;
            flashPad();
          }
          if (e.type === "hat") {
            hatE = 1;
            eqVal[5] = Math.max(eqVal[5], 0.7);
            eqVal[6] = Math.max(eqVal[6], 0.85);
          }
          if (e.type === "chord") {
            eqVal.forEach((v, i) => (eqVal[i] = Math.max(v, 0.6)));
            flashChord();
            if (Math.random() < 0.5) spawnNote(pick(SPK), "sp");
          }
          if (e.type === "stab") {
            flashChord();
          }
          if (e.type === "lead") {
            const vv = e.v === 2 ? vis2 : vis1;
            spawnNote(vv.notePos, null, vv.color);
            eqVal[4] = 1;
          }
          if (e.type === "alead") {
            spawnNote(
              [6.9, -0.6, 9.9],
              null,
              getComputedStyle(document.body).getPropertyValue("--cyan").trim(),
            );
            eqVal[4] = 1;
          }
        }

        if (
          mobileVisual30 &&
          frameNow - lastVisualFrame < visualFrameInterval
        ) {
          return;
        }
        lastVisualFrame = frameNow;
        if (cutsceneActive) updateCutscene(frameNow);

        kickE *= mobileVisual30 ? 0.74 : 0.86;
        snareE *= mobileVisual30 ? 0.72 : 0.85;
        hatE *= mobileVisual30 ? 0.64 : 0.8;
        sfxA.style.opacity = sfxB.style.opacity = Math.min(
          1,
          kickE * 1.3,
        ).toFixed(2);
        sfxC.style.opacity = Math.min(1, hatE * 1.1).toFixed(2);
        sfxD.style.opacity = Math.min(1, snareE * 1.2).toFixed(2);
        /* walk cycle: slow amble, big committed swing, bouncing body */
        walkAmp += ((roaming && playing ? 1 : 0) - walkAmp) * 0.05;
        const wp = now * Math.PI * 0.55;
        const bob = Math.abs(Math.sin(wp)) * 2.6 * walkAmp; // body rises mid-step
        if (!reduceMotion && walkAmp > 0.005) {
          const th = 0.38 * Math.sin(wp) * walkAmp; // ±22° around the hinge axle
          poseLeg(legA3, th, Math.max(0, Math.cos(wp)) * 2.2 * walkAmp, bob);
          poseLeg(legB3, -th, Math.max(0, -Math.cos(wp)) * 2.2 * walkAmp, bob);
          [
            [gVis, visitor, 0.9],
            [gVis2, visitor2, 2.1],
          ].forEach(([g, on, ph]) => {
            if (!on) return;
            const parts = getGuestMotionParts(g);
            const eA = parts.legA,
              eB = parts.legB;
            if (!eA || !eB) return;
            const bv = (Math.abs(Math.sin(wp + ph)) * 2.2 * walkAmp).toFixed(1);
            const a = (13 * Math.sin(wp + ph) * walkAmp).toFixed(2);
            eA.setAttribute(
              "transform",
              `translate(0 ${bv}) rotate(${a} ${eA.dataset.px} ${eA.dataset.py})`,
            );
            eB.setAttribute(
              "transform",
              `translate(0 ${bv}) rotate(${-a} ${eB.dataset.px} ${eB.dataset.py})`,
            );
            const fa = parts.freeArm;
            if (fa) {
              let ang = 0;
              if (g.classList.contains("waving"))
                ang = -20 + Math.sin(now * 7) * 16; // big friendly goodbye wave
              else if (fa.dataset.mode === "walk")
                ang = 10 * Math.sin(wp + ph + 0.6) * walkAmp;
              else ang = 2 * Math.sin(now * 1.2 + ph); // gentle idle sway, not beat-synced
              fa.setAttribute(
                "transform",
                `translate(0 ${bv}) rotate(${ang.toFixed(2)} ${fa.dataset.px} ${fa.dataset.py})`,
              );
            }
          });
        }
        if (!reduceMotion && !cutsceneActive) {
          gAri.style.transform = `translateY(${(-bob).toFixed(1)}px)`;
          if (playing)
            gHead.style.transform = `translateY(${(kickE * 4.2).toFixed(1)}px)`;
          gArmL.style.transform = `translateY(${(kickE * 2).toFixed(1)}px)`;
          gArmLup.style.transform = `translateY(${(kickE * 3.4).toFixed(1)}px)`;
          gArmR.style.transform = `translateY(${(snareE * 2.4).toFixed(1)}px)`;
          gArmRup.style.transform = `translateY(${(kickE * 3.0).toFixed(1)}px)`;
          if (visitor)
            gVis.style.transform = `translateY(${(Math.sin(now * 2.2) * 2.4 - Math.abs(Math.sin(wp + 0.9)) * 2.2 * walkAmp).toFixed(1)}px)`;
          if (visitor2)
            gVis2.style.transform = `translateY(${(Math.sin(now * 2.2 + 1.7) * 2.4 - Math.abs(Math.sin(wp + 2.1)) * 2.2 * walkAmp).toFixed(1)}px)`;
          let maxDroop = 0;
          getMicHoldEls().forEach((el) => {
            const ph = +el.dataset.ph;
            if (ph < 0) return; // holds it properly — no animation
            const dp = micDroop(now, ph);
            maxDroop = Math.max(maxDroop, dp);
            const a = -52 * dp; // sag toward vertical, snap back
            el.setAttribute(
              "transform",
              "rotate(" +
                a.toFixed(1) +
                " " +
                el.dataset.px +
                " " +
                el.dataset.py +
                ")",
            );

          else if (ariSurprisedUntil > now) setAriExpr("surprised");

        if (!reduceMotion && playing && track && gWheelSpin) {

          const cph = Math.cos(phi),
            sph = Math.sin(phi);
          const ma = cph,
            mb = (IB / IA) * sph,
            mc = -(IA / IB) * sph,
            md = cph;
          const me = WC[0] - (ma * WC[0] + mc * WC[1]);
          const mf = WC[1] - (mb * WC[0] + md * WC[1]);
          gWheelSpin.setAttribute(
            "transform",
            `matrix(${ma.toFixed(4)} ${mb.toFixed(4)} ${mc.toFixed(4)} ${md.toFixed(4)} ${me.toFixed(1)} ${mf.toFixed(1)})`,
          );
        }
        for (let i = 0; i < 7; i++) {
          eqVal[i] = Math.max(0.08, eqVal[i] * 0.9);
          eqEls[i].setAttribute("y2", (eqBase[i].b - eqVal[i] * 44).toFixed(1));
        }
        for (let i = 0; i < 8; i++) {
          faderPos[i] += (faderTarget[i] - faderPos[i]) * 0.03;
          faderEls[i].style.transform =
            `translate(${(-faderPos[i] * IA * 0.28).toFixed(1)}px,${(-faderPos[i] * IB * 0.28).toFixed(1)}px)`;
        }
        if (
          playing &&
          track &&
          frameNow - lastMetaUpdate >= 250
        ) {
          lastMetaUpdate = frameNow;
          updateMeta(Math.max(0, now - trackStart));
        }
        if (batteryIntermission) {
          const bf = document.getElementById("battFill");
          if (bf)
            bf.setAttribute(
              "width",
              (Math.max(0, Math.sin(now * 1.1)) * 46).toFixed(1),
            );
        }
      }
      requestAnimationFrame(frame);

      /* ============================================================
   TRANSPORT
   ============================================================ */
      const hint = document.getElementById("hint");
      const info = document.getElementById("trackinfo");

      function start() {
        if (!ctx) initAudio();
        ctx.resume();
        if (bgAudioEl) bgAudioEl.play().catch(() => {}); // must fire inside this click for iOS to grant it
        if (!track)
          newTrack(DEBUG_GENRE && GENRES[DEBUG_GENRE] ? DEBUG_GENRE : undefined);
        playing = true;
        started = true;
        hint.style.display = "none";
        memoryControl.style.display = "flex";
        info.style.display = "block";
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            memoryControl.classList.add("show");
            setTimeout(() => info.classList.add("show"), 220);
          }),
        );
        const vl = document.getElementById("visitorline");
        vl.textContent = "A.R.I. is tuning into the street signal…";
        vl.style.color = "var(--trackcyan)";
        vl.classList.add("on");
        setCypherLine(false);
        setTimeout(() => {
          if (!visitor) vl.classList.remove("on");
        }, 4200);
        stopSleepZ();
        setPausedEyes(false);
        step = 0;
        bar = 0;
        stepIndex = 0;
        audioStart = ctx.currentTime + 0.1;
        trackStart = audioStart;
        timerId = setInterval(tick, 25);
        if (!visitor && !pendingReq) scheduleVisitor();
        scheduleReverse();
        roaming = true;
        scheduleRoam();
        setLocation(pick(LOCS));
        grabWakeLock();
        updateMediaSession();
        if ("mediaSession" in navigator)
          navigator.mediaSession.playbackState = "playing";
      }
      function stop() {
        playing = false;
        const chatEl = document.getElementById("chat");
        if (chatEl) chatEl.classList.remove("on");
        clearInterval(timerId);
        clearTimeout(visitorTimer);
        clearTimeout(revTimer);
        clearTimeout(roamTimer);
        clearTimeout(locTimer);

        weakIntro:["intro ran a little long","still waiting for the track to open up","slow start this time"],
        battery:["rip battery","the ritual","stretch break y'all","he carries spares dw"],
        switch:["WAIT HE SWITCHED IT","beat switch??","HALF TIME","no way he flipped it","two songs in one 🔥"],
        keychange:["KEY CHANGE","it LIFTED","modulation?? from a robot??","goosebumps fr","final stretch energy"],
        cut:["THE SILENCE","he cut EVERYTHING","that dropout 💀","my heart stopped","dead air into THAT"],
      };
      function fillLine(line){
        return line.replaceAll('{genre}',track?displayGenre(track.genre):'beat').replaceAll('{name}',track?.name||'this').replaceAll('{bpm}',track?.bpm||'');
      }
      function audiencePush(txt, user, signal){
        if(!txt)return;
        const u=user||pick(CHAT_USERS), msg={nick:u.nick,ci:u.ci,txt,kind:u.kind,signal:signal||'chat',time:Date.now()};
        audienceBuffer.push(msg); while(audienceBuffer.length>60)audienceBuffer.shift();
        const a=audienceState(); if(a){a.reactions.push(msg);while(a.reactions.length>80)a.reactions.shift();a.chatRate=Math.min(1,a.chatRate*.82+.18);}
        if(chatOn()) appendChatNode(chatLogEl,msg,'chatMsg',16);
        if(focusEl?.classList.contains('on')) appendChatNode(focusLogEl,msg,'focusMsg',10);
      }
      function appendChatNode(parent,msg,cls,max){
        if(!parent)return; const d=document.createElement('div');d.className=cls;
        const nk=document.createElement('span');nk.className='nick';nk.style.color=visPalette()[msg.ci%visPalette().length];nk.textContent=msg.nick;
        d.appendChild(nk);d.appendChild(document.createTextNode(msg.txt));parent.appendChild(d);
        while(parent.children.length>max)parent.firstChild.remove();requestAnimationFrame(()=>d.classList.add('in'));
      }
      function audienceReact(type, strength=.6){
        const a=audienceState(); if(!a||!track)return;
        const reactionTrackNo=trackNo;
        const bank=EVENT_LINES[type]||EVENT_LINES.newtrack;
        let count=1+(strength>.72?1:0)+(strength>.9?1:0);
        for(let i=0;i<count;i++){
          const regular=Math.random()<.18?CHAT_USERS[RI(0,9)]:null;
          const line=regular&&Math.random()<.35?pick(REGULAR_LINES):pick(bank);
          setTimeout(()=>{
            if(trackNo!==reactionTrackNo)return; // never let delayed opinions leak into the next track
            audiencePush(fillLine(line),regular,type);
          },i*RI(180,520));
        }
        const scoreMap={hook:'melody',drop:'bass',fill:'drums',performance:'guest',response:'arrangement',ending:'arrangement'};
        if(scoreMap[type])a.scores[scoreMap[type]]=Math.min(1,a.scores[scoreMap[type]]+strength*.08);
        if(type.startsWith('weak'))a.retention=Math.max(.55,a.retention-.012*strength); else a.retention=Math.min(.98,a.retention+.002*strength);
        const entries=Object.entries(a.scores).sort((x,y)=>y[1]-x[1]);a.favorite=entries[0][0];a.weakest=entries.at(-1)[0];
        const avg=entries.reduce((n,x)=>n+x[1],0)/entries.length;
        a.mood=avg>.68?'HYPED':avg>.57?'LOCKED IN':avg>.47?'CURIOUS':'RESTLESS';
      }
      function audienceDevHTML(t){
        const a=t?.audienceBrain;if(!a)return '<div class="devnone">—</div>';
        return `<div class="krow"><span>watching</span><b>${Math.round(a.viewers).toLocaleString()}</b><span class="kdim">${Math.round(a.active*100)}% active · ${a.returning} regulars</span></div>
          <div class="krow"><span>mood</span><b>${a.mood}</b><span class="kdim">retention ${Math.round(a.retention*100)}% · chat ${Math.round(a.chatRate*100)}%</span></div>
          <div class="krow"><span>favorite</span><b>${a.favorite}</b><span class="kdim">weakest ${a.weakest}</span></div>
          <div class="dflags">opinionated personas · event reactions · community memory · noisy feedback, not a truth score</div>`;
      }
      function audienceBufferHTML(max=18){
        const rows=audienceBuffer.slice(-max);
        if(!rows.length)return '<div class="devnone">no reactions yet</div>';
        const safe=(value)=>String(value??'').replace(/[&<>"']/g,c=>({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
        return rows.map(m=>{
          const color=visPalette()[m.ci%visPalette().length];
          return `<div class="devChatMsg"><span class="devChatName" style="color:${color}">${safe(m.nick)}:</span><span class="devChatText">${safe(m.txt)}</span></div>`;
        }).join('');
      }
      let focusTimer=null, lastFocusTrack=0;
      function showAudienceFocus(){
        if(!focusEl||innerWidth>=900||!playing||lastFocusTrack===trackNo)return;
        lastFocusTrack=trackNo;document.body.classList.add('audience-focus');focusEl.classList.add('on');focusEl.setAttribute('aria-hidden','false');
        focusStatsEl.textContent=`${Math.round(audienceState()?.viewers||0).toLocaleString()} watching · ${audienceState()?.mood||'LIVE'}`;
        focusLogEl.innerHTML='';audienceBuffer.slice(-7).forEach(m=>appendChatNode(focusLogEl,m,'focusMsg',10));
        clearTimeout(focusTimer);focusTimer=setTimeout(()=>{focusEl.classList.remove('on');focusEl.setAttribute('aria-hidden','true');document.body.classList.remove('audience-focus');},RI(4200,5600));
      }
      let audiencePrev={trackNo:0,bar:-1,phase:'',batt:false,v2:false,section:'',sameHatBars:0,lastHatSig:'',guestBars:0};
      setInterval(()=>{
        if(!playing||!started||!track)return;const a=audienceState();if(!a)return;a.chatRate*=.9;
        a.viewers=Math.max(700,a.viewers+RI(-18,26));
        if(trackNo!==audiencePrev.trackNo){
          audiencePrev={trackNo,bar:-1,phase:'',batt:false,v2:false,section:'',sameHatBars:0,lastHatSig:'',guestBars:0};
          audienceBuffer.length=0; // a new audience cannot already know how this performance develops
          audienceReact('newtrack',.75);return;
        }
        if(batteryIntermission!==audiencePrev.batt){audiencePrev.batt=batteryIntermission;if(batteryIntermission)audienceReact('battery',.7);return;}
        if(visitorPhase!==audiencePrev.phase){audiencePrev.phase=visitorPhase;if(visitorPhase==='requesting')audienceReact('guest',.72);if(visitorPhase==='performing')audienceReact('performance',.85);}
        if(bar!==audiencePrev.bar){
          audiencePrev.bar=bar;const c=composerStateAt(track,bar),d=drumStateAt(bar),sect=sectionAt(bar);
          const barsHeard=Math.max(0,bar+1);
          const previousSection=audiencePrev.section;
          audiencePrev.section=sect;

          // In the opening, the audience can only react to what it has actually heard.
          if(bar===0)audienceReact('intro',.45);
          if(c.role==='hook')audienceReact('hook',.9);
          else if(c.role==='response')audienceReact('response',.72);
          if(sect==='break'&&bar%4===0)audienceReact('break',.65);
          if(d?.useFill)audienceReact('fill',.55);
          if(sect==='main2'&&bar%4===0)audienceReact('drop',.88);
          if(track.special&&bar===track.special.bar)audienceReact(track.special.type==='halftime'?'switch':'keychange',.95);
          if(track.cutBar!=null&&bar===track.cutBar+1)audienceReact('cut',.95);
          if(bar>=track.bars-2)audienceReact('ending',.65);

          // Track how long an audible hat idea has remained materially unchanged.
          const hatSource=d?.hats??d?.hat??d?.hatPattern??d?.pattern?.hats??null;
          const hatSig=hatSource==null?'':JSON.stringify(hatSource);
          if(hatSig&&hatSig===audiencePrev.lastHatSig)audiencePrev.sameHatBars++;
          else {audiencePrev.lastHatSig=hatSig;audiencePrev.sameHatBars=hatSig?1:0;}

          if(visitorPhase==='performing')audiencePrev.guestBars++; else audiencePrev.guestBars=0;
          const clutter=(c.guest||0)+(c.instrumental||0)+(c.hats||0);

          // Criticism needs evidence and listening time. Nothing negative is allowed in the first 8 bars.
          if(barsHeard>=8){
            if(clutter>2.55&&Math.random()<.16)audienceReact('weakClutter',.42);
            if(audiencePrev.sameHatBars>=8&&Math.random()<.14)audienceReact('weakHats',.4);
            if(c.instrumental>.85&&barsHeard>=12&&Math.random()<.06)audienceReact('weakMelody',.35);
            if(audiencePrev.guestBars>=4&&c.guest<.48&&Math.random()<.12)audienceReact('weakGuest',.4);
            if(previousSection==='intro'&&sect!=='intro'&&bar>=8&&Math.random()<.12)audienceReact('weakIntro',.32);
          }
          if(innerWidth<900 && bar>5 && bar<track.bars-4 && bar%4===0 && Math.random()<.18)showAudienceFocus();
        }
        // Casual chat also waits until listeners have heard at least a full bar.
        if(bar>=1&&Math.random()<.065)audiencePush(fillLine(pick(["vibes","clean mix","nyc energy fr","robot got taste","this groove is criminal","whoever tuned that snare, thank u","lowkey a banger","let it breathe"])),null,'ambient');
      },650);
      /* desktop chat remains occasional; compact screens use the brief focus overlay */
      let chatLocCount=0,chatHideTimer=null;
      function flashChat(){const el=document.getElementById('chat');if(!el||!chatOn()||!playing)return;el.classList.add('on');clearTimeout(chatHideTimer);chatHideTimer=setTimeout(()=>el.classList.remove('on'),R(16000,24000));}
      function chatOnLocation(){if(++chatLocCount%2===0)flashChat();}
      /* ---------- weather: a small, quiet text line in the empty corner ---------- */
      const WX_LABEL = {
        0: "clear",
        1: "mostly clear",
        2: "partly cloudy",
        3: "overcast",
        45: "fog",
        48: "fog",
        51: "drizzle",
        53: "drizzle",
        55: "drizzle",
        56: "freezing drizzle",
        57: "freezing drizzle",
        61: "rain",
        63: "rain",
        65: "rain",
        66: "freezing rain",
        67: "freezing rain",
        71: "snow",
        73: "snow",
        75: "snow",
        77: "snow",
        80: "rain showers",
        81: "rain showers",
        82: "rain showers",
        85: "snow showers",
        86: "snow showers",
        95: "thunderstorm",
        96: "thunderstorm",
        99: "thunderstorm",
      };
      const WX_COLOR = {
        clear: "#8fd4f0",
        "mostly clear": "#a5d8ec", // clear sky = light blue
        "partly cloudy": "#b8c4cc",
        overcast: "#9aa4ad",
        fog: "#c7ccd1",
        drizzle: "#4a94e0",
        "freezing drizzle": "#4a94e0",
        rain: "#4a94e0",
        "freezing rain": "#4a94e0",
        "rain showers": "#4a94e0", // rain = deeper blue
        snow: "#e8ecef",
        "snow showers": "#e8ecef",
        thunderstorm: "#b98bff",
      };
      function battColor(pct) {
        const p = Math.max(0, Math.min(100, pct)) / 100;
        const full = [46, 204, 113],
          empty = [231, 76, 60]; // green → red
        const c = full.map((v, i) => Math.round(v * p + empty[i] * (1 - p)));
        return `rgb(${c[0]},${c[1]},${c[2]})`;
      }
      let wxWeather = null;
      let wxSignalTimer = 0;
      let wxSignalCleanupTimer = 0;
      const WX_SIGNAL_MIN_DELAY = 3 * 60 * 1000;
      const WX_SIGNAL_MAX_DELAY = 6 * 60 * 1000;
      const NYC_TIME_FORMATTER = new Intl.DateTimeFormat("en-GB", {
        timeZone: "America/New_York",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      });
      function nycTime() {
        return NYC_TIME_FORMATTER.format(new Date());
      }
      function wxSignalKind(label) {
        if (label === "thunderstorm") return "storm";
        if (label.includes("rain") || label.includes("drizzle")) return "rain";
        if (label.includes("snow")) return "snow";
        if (["partly cloudy", "overcast", "fog"].includes(label))
          return "cloud";
        return "clear";
      }
      function renderWxWeather() {
        const el = document.getElementById("wxWeather");
        if (!wxWeather) {
          el.replaceChildren();
          return;
        }
        const condition = document.createElement("span");
        condition.className = `wxCond wxCond--${wxSignalKind(wxWeather.label)}`;
        condition.style.setProperty("--wx-color", wxWeather.color);
        condition.textContent = wxWeather.label;
        el.replaceChildren(
          document.createTextNode(
            ` · ${wxWeather.f}°f / ${wxWeather.c}°c · `,
          ),
          condition,
        );
      }
      function nextWxSignalDelay() {
        return Math.round(
          WX_SIGNAL_MIN_DELAY +
            Math.random() * (WX_SIGNAL_MAX_DELAY - WX_SIGNAL_MIN_DELAY),
        );
      }
      function scheduleWxSignal(delay = nextWxSignalDelay()) {
        if (reduceMotion) return;
        clearTimeout(wxSignalTimer);
        wxSignalTimer = setTimeout(runWxSignal, delay);
      }
      function runWxSignal() {
        const condition = document.querySelector("#wxWeather .wxCond");
        if (!document.hidden && condition) {
          clearTimeout(wxSignalCleanupTimer);
          condition.classList.remove("wx-signal");
          void condition.offsetWidth;
          condition.classList.add("wx-signal");
          wxSignalCleanupTimer = setTimeout(() => {
            if (condition.isConnected) condition.classList.remove("wx-signal");
          }, 2600);
        }
        scheduleWxSignal();
      }
      function renderWxLine() {
        const el = document.getElementById("wxText");
        const clockEl = document.getElementById("wxClock");
        const batteryEl = document.getElementById("wxBattery");
        let battHTML;
        if (batteryIntermission) {
          battHTML = "rig battery: swapping now";
        } else if (track) {
          const remaining = tracksUntilBattery - bar / Math.max(1, track.bars);
          const pct = Math.max(
            1,
            Math.min(100, Math.round((remaining / batteryTotal) * 100)),
          );
          battHTML = `rig battery: <span style="color:${battColor(pct)}">${pct}%</span>`;
        } else {
          battHTML = `rig battery: <span style="color:${battColor(100)}">100%</span>`;
        }
        clockEl.textContent = `nyc ${nycTime()}`;
        batteryEl.innerHTML = battHTML;
        el.classList.add("show");
      }
      async function loadWeather() {
        try {
          const res = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=40.7128&longitude=-74.006&current=weather_code,temperature_2m&timezone=America%2FNew_York",
          );
          if (!res.ok) return;
          const data = await res.json();
          const cur = data && data.current;
          if (!cur || cur.temperature_2m == null) return;
          const label = WX_LABEL[cur.weather_code];
          if (!label) return;
          const c = Math.round(cur.temperature_2m);
          const f = Math.round((c * 9) / 5 + 32);
          const color = WX_COLOR[label] || "inherit";
          const conditionChanged = wxWeather && wxWeather.label !== label;
          wxWeather = { label, c, f, color };
          renderWxWeather();
          renderWxLine();
          if (conditionChanged) scheduleWxSignal(1200);
          else if (!wxSignalTimer) scheduleWxSignal();
        } catch (e) {
          /* offline, blocked, or unavailable — weather part just stays empty */
        }
      }
      loadWeather();
      setInterval(loadWeather, 30 * 60 * 1000); // refresh every 30 minutes

      /* battery level ticks down smoothly as bars pass, so you can watch the swap approach */
      renderWxLine(); // show immediately, even before weather loads
      setInterval(renderWxLine, 1000); // keep the NYC clock current

      /* ---------- PWA: service worker registration ---------- */
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        addEventListener("load", () =>
          navigator.serviceWorker
            .register("./sw.js", { scope: "./" })
            .catch(() => {}),
        );
      }
