-->

    <style>
      :root {
        --bg: #030409;
        --cyan: #3ee8de;
        --cyan-dim: #1f8f8a;
        --purple: #a78bff;
        --purple-dim: #5e50a8;
        --lav: #b9a8ff;
        --magenta: #ff5fd2;
        --orange: #3ee8de; /* folded back into the cyan/purple palette */
        --orange-dim: #1f8f8a;
        --key: #eef6f6;
        --key-dim: #7e9496;
        --blue: #a78bff; /* speakers/details now read as purple, not extra blue */
        --faint: #111722;
        --muted: #3a4456;
        --nyc-green: #007a3d;
        --nyc-green-dim: #2fa66f;
        --text: #dfeef0;
        --support: #aab6bd;
        --glow1: rgba(62, 232, 222, 0.45);
        --glow2: rgba(120, 90, 255, 0.14);
        --btng: rgba(62, 232, 222, 0.25);
        --trackcyan: #52c8c0; /* dark-mode-only: a good bit lighter than cyan-dim for track time + meta */
        --signgreen: #58cc8c; /* dark-mode-only: lighter street-sign green */
        --livetext: #f4f7f7; /* LIVE overlay text — bright on the dark stage */
        --ratinggold: #ff5fd2; /* remembered heart — pink with matching glow */
        --ratinggold-hover: #ff8dde;
        --ratingempty: #5f6875;
      }
      body.light {
        --bg: #f2f4f6;
        --cyan: #0b9c93;
        --cyan-dim: #7fb0ac;
        --purple: #7452e8;
        --purple-dim: #a795e0;
        --lav: #7452e8;
        --magenta: #d61e9e;
        --orange: #0b9c93;
        --orange-dim: #7fb0ac;
        --key: #26313c;
        --key-dim: #93a0a6;
        --blue: #7452e8;
        --faint: #d9dee6;
        --muted: #8b94a3;
        --nyc-green: #007a3d;
        --nyc-green-dim: #0a6d40;
        --text: #16202a;
        --support: #5c6672;
        --glow1: rgba(11, 156, 147, 0.2);
        --glow2: rgba(116, 82, 232, 0.08);
        --btng: rgba(11, 156, 147, 0.18);
        --trackcyan: #0a7a72; /* light mode: darker teal so track time/meta clears AA */
        --signgreen: var(--nyc-green-dim);
        --livetext: #c81e2a; /* light mode: dark red so LIVE stays readable on light bg */
        --ratinggold: #b00075; /* darker pink for strong contrast on light */
        --ratinggold-hover: #d61e9e;
        --ratingempty: #8b94a3;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
      }
      body {
        color: var(--text);
        font-family: "IBM Plex Mono", monospace;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100vh;
        height: 100svh;
        background: var(--bg);
        transition: background 0.4s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 48px;
        cursor: pointer;
      }
      svg#scene {
        width: min(92vw, 86vh);
        height: min(92vw, 86vh);
        filter: drop-shadow(0 0 6px var(--glow1))
          drop-shadow(0 0 26px var(--glow2));
      }
      svg * {
        vector-effect: non-scaling-stroke;
      }
      .c {
        stroke: var(--cyan);
        fill: none;
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .cd {
        stroke: var(--cyan-dim);
        fill: none;
        stroke-width: 1.05;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.68;
      }
      .p {
        stroke: var(--purple);
        fill: none;
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .pd {
        stroke: var(--purple-dim);
        fill: none;
        stroke-width: 1.05;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.68;
      }
      .o {
        stroke: var(--orange);
        fill: none;
        stroke-width: 1.6;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .od {
        stroke: var(--orange-dim);
        fill: none;
        stroke-width: 1.05;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.68;
      }
      .w {
        stroke: var(--key);
        fill: none;
        stroke-width: 1.4;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .wd {
        stroke: var(--key-dim);
        fill: none;
        stroke-width: 1;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.72;
      }
      .b {
        stroke: var(--blue);
        fill: none;
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .occface {
        fill: var(--bg);
        stroke: none;
        opacity: 0.985;
      }
      .legFace {
        fill: var(--bg);
        stroke-width: 1.25;
      }
      .isoHidden {
        opacity: 0.22;
        stroke-width: 0.75;
      }
      .wtxt {
        font-family: "IBM Plex Mono", monospace;
        font-size: 4.2px;
        fill: var(--key-dim);
        stroke: none;
      }
      .key {
        fill: transparent;
        transition: fill 0.22s;
      }
      .key.on {
        fill: var(--key);
        fill-opacity: 0.4;
        transition: fill 0.05s;
      }
      .rec {
        fill: var(--magenta);
        stroke: none;
        animation: recblink 1s steps(1) infinite;
      }
      .sgn {
        stroke: var(--muted);
        fill: none;
        stroke-width: 1.1;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .signblade {
        stroke: var(--nyc-green);
        fill: none;
        stroke-width: 1.35;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .signmark {
        stroke: var(--nyc-green-dim);
        fill: none;
        stroke-width: 1.05;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.75;
      }
      .bg {
        stroke: var(--muted);
        fill: none;
        stroke-width: 0.9;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.5;
      }
      .sgntxt {
        font-family: "IBM Plex Mono", monospace;
        font-size: 9px;
        fill: var(--signgreen);
        stroke: none;
        letter-spacing: 0.12em;
        opacity: 0.9;
      }
      /* cameraman-robot cutscene actor */
      .rbShadow {
        fill: #000;
        opacity: 0.32;
      }
      .rbBatt {
        stroke: var(--signgreen);
        fill: none;
        stroke-width: 1.9;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .rbFill {
        fill: var(--signgreen);
        opacity: 0.2;
        stroke: none;
      }
      .rbBolt {
        fill: var(--signgreen);
        opacity: 0.9;
        stroke: none;
      }
      .rbDot {
        fill: var(--magenta);
        stroke: none;
      }
      .rbRec {
        fill: #ff2638;
        stroke: none;
        animation: recblink 1s steps(1) infinite;
      }
      .rbStreak {
        stroke: var(--cyan);
        stroke-width: 1.4;
        stroke-linecap: round;
        opacity: 0;
      }
      #followBubble {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 7;
        pointer-events: none;
        max-width: min(84vw, 380px);
        transform: translate(-50%, -100%);
        padding: 12px 16px;
        border-radius: 14px;
        background: var(--bg);
        border: 1.5px solid var(--bubbleColor, var(--cyan));
        box-shadow: 0 0 14px var(--bubbleColor, var(--cyan));
        opacity: 0;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      #followBubble.on {
        opacity: 1;
        transform: translate(-50%, -100%) translateY(-8px);
      }
      #followBubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -8px;
        margin-left: -8px;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 8px solid var(--bubbleColor, var(--cyan));
      }
      #followBubbleText {
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.03em;
        color: var(--text);
        text-align: center;
        line-height: 1.5;
      }
      #gSign {
        opacity: 0;
        transition: opacity 1.6s ease;
      }
      #gSign.here {
        opacity: 0.8;
      }
      .rectxt {
        font-family: "IBM Plex Mono", monospace;
        font-size: 5.5px;
        fill: var(--magenta);
        stroke: none;
        letter-spacing: 0.1em;
      }
      @keyframes recblink {
        50% {
          opacity: 0;
        }
      }
      .l {
        stroke: var(--lav);
        fill: none;
        stroke-width: 1.4;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .m {
        stroke: var(--magenta);
        fill: none;
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .v {
        stroke: currentColor;
        fill: none;
        stroke-width: 1.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .vcapfill {
        fill: var(--bg);
        stroke: none;
        opacity: 0.985;
      }
      .vsolid {
        fill: currentColor;
        stroke: currentColor;
        stroke-width: 1.2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .vc {
        stroke: currentColor;
        fill: none;
        stroke-width: 1;
        stroke-linejoin: round;
        stroke-linecap: round;
        opacity: 0.85;
      }
      .g {
        stroke: url(#grad);
        fill: none;
        stroke-width: 1.6;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .f {
        stroke: var(--faint);
        fill: none;
        stroke-width: 1.2;
      }
      .pad {
        fill: rgba(167, 139, 255, 0);
        transition: fill 0.35s;
      }
      #gVisitor,
      #gVisitor2 {
        opacity: 0;
        transition: opacity 1.4s ease;
      }
      #gVisitor.here,
      #gVisitor2.here {
        opacity: 1;
      }
      #gArmL,
      #gArmLup,
      #gArmR,
      #gArmRup {
        transition: opacity 0.6s ease;
      }
      .note {
        font-family: "IBM Plex Mono", monospace;
        font-size: 22px;
        fill: var(--magenta);
        opacity: 0;
      }
      .note.sp {
        fill: var(--lav);
        font-size: 20px;
      }
      .note.sleepz {
        fill: var(--trackcyan);
        font-size: 16px;
        font-weight: 500;
        text-transform: lowercase;
        filter: drop-shadow(0 0 4px var(--glow1));
      }
      @keyframes sleepZRise {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }
        16% {
          opacity: 0.9;
        }
        78% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: translateY(-72px);
        }
      }
      .note.sleepz.go {
        animation: sleepZRise 2.8s ease-in-out forwards;
      }
            @keyframes noteRise {
        0% {
          opacity: 0;
          transform: translateY(4px);
        }
        15% {
          opacity: 0.95;
        }
        100% {
          opacity: 0;
          transform: translateY(-72px);
        }
      }
      .note.go {
        animation: noteRise 2.2s ease-out forwards;
      }

      /* ---------- brief track feedback from A.R.I. ---------- */

      /* ---------- UI ---------- */
      header {
        position: fixed;
        top: 26px;
        left: 30px;
        pointer-events: none;
        z-index: 5;
      }
      header h1 {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: clamp(26px, 3.4vw, 40px);
        letter-spacing: 0.14em;
        color: var(--text);
        text-shadow: 0 0 14px var(--glow1);
      }
      header h1 a {
        color: inherit;
        text-decoration: none;
        pointer-events: auto;
        cursor: pointer;
      }
      header h1 a:hover {
        opacity: 0.8;
      }
      header p {
        margin-top: 4px;
        font-size: 10px;
        letter-spacing: 0.32em;
        color: var(--magenta);
      }
      header .tribute {
        margin-top: 10px;
        font-size: 13px;
        letter-spacing: 0.12em;
        color: var(--support);
        text-transform: none;
        max-width: min(40vw, 560px);
        line-height: 1.6;
      }
      #hint {
        position: fixed;
        left: 30px;
        right: 30px;
        top: 24%;
        bottom: auto;
        transform: none;
        font-size: 11px;
        letter-spacing: 0.3em;
        color: var(--magenta);
        animation: pulse 2.6s ease-in-out infinite;
        z-index: 5;
        pointer-events: none;
        text-transform: uppercase;
        white-space: normal;
        text-align: center;
        overflow-wrap: break-word;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      #wxText {
        margin-top: 6px;
        line-height: 1.6;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.14em;
        color: var(--support);
        text-transform: uppercase;
        text-align: left;
        opacity: 0;
        transition: opacity 1.4s ease;
      }
      #wxText.show {
        opacity: 0.9;
      }
      .wxCond {
        --wx-color: currentColor;
        position: relative;
        display: inline-block;
        color: inherit;
        text-decoration: none;
        isolation: isolate;
      }
      .wxCond::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 1px;
        height: 1.5px;
        background: var(--wx-color);
        opacity: 0.86;
        transform-origin: center;
        pointer-events: none;
      }
      .wxCond::before {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 42%;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--wx-color),
          transparent
        );
        filter: blur(0.45px);
        opacity: 0;
        transform: translateX(-115%) scaleX(0.65);
        pointer-events: none;
      }
      .wxCond.wx-signal {
        will-change: color, text-shadow;
      }
      .wxCond.wx-signal::before {
        animation: wxUnderlinePass 2.4s cubic-bezier(0.2, 0.7, 0.25, 1);
      }
      .wxCond.wx-signal::after {
        animation: wxUnderlineWake 2.4s ease-in-out;
      }
      .wxCond--clear.wx-signal {
        animation: wxClearSignal 2.4s ease-in-out;
      }
      .wxCond--cloud.wx-signal {
        animation: wxCloudSignal 2.4s ease-in-out;
      }
      .wxCond--rain.wx-signal {
        animation: wxRainSignal 2.4s ease-in-out;
      }
      .wxCond--snow.wx-signal {
        animation: wxSnowSignal 2.4s ease-in-out;
      }
      .wxCond--storm.wx-signal {
        animation: wxStormSignal 2.4s ease-in-out;
      }
      @keyframes wxUnderlinePass {
        0% {
          opacity: 0;
          transform: translateX(-115%) scaleX(0.65);
        }
        34% {
          opacity: 0.72;
        }
        72% {
          opacity: 0.34;
        }
        100% {
          opacity: 0;
          transform: translateX(255%) scaleX(1);
        }
      }
      @keyframes wxUnderlineWake {
        0%,
        100% {
          opacity: 0.86;
          transform: scaleX(1);
          box-shadow: 0 0 0 transparent;
        }
        42% {
          opacity: 1;
          transform: scaleX(0.97);
          box-shadow: 0 0 5px var(--wx-color);
        }
        68% {
          transform: scaleX(1.015);
        }
      }
      @keyframes wxClearSignal {
        0%,
        100% {
          color: inherit;
          text-shadow: 0 0 0 transparent;
        }
        48% {
          color: var(--wx-color);
          text-shadow: 0 0 7px var(--wx-color);
        }
      }
      @keyframes wxCloudSignal {
        0%,
        100% {
          color: inherit;
          text-shadow: 0 0 0 transparent;
        }
        38% {
          color: var(--wx-color);
          text-shadow: -2px 0 6px var(--wx-color);
        }
        64% {
          color: var(--wx-color);
          text-shadow: 2px 0 7px var(--wx-color);
        }
      }
      @keyframes wxRainSignal {
        0%,
        100% {
          color: inherit;
          text-shadow: 0 0 0 transparent;
        }
        38% {
          color: var(--wx-color);
          text-shadow: 0 -2px 5px var(--wx-color);
        }
        64% {
          color: var(--wx-color);
          text-shadow: 0 2px 6px var(--wx-color);
        }
      }
      @keyframes wxSnowSignal {
        0%,
        100% {
          color: inherit;
          text-shadow: 0 0 0 transparent;
        }
        50% {
          color: var(--wx-color);
          text-shadow: 0 0 9px var(--wx-color);
        }
      }
      @keyframes wxStormSignal {
        0%,
        31%,
        42%,
        56%,
        100% {
          color: inherit;
          text-shadow: 0 0 0 transparent;
        }
        35%,
        49% {
          color: var(--wx-color);
          text-shadow: 0 0 9px var(--wx-color);
        }
      }
      #trackinfo {
        position: fixed;
        left: 30px;
        right: 30px;
        bottom: 30px;
        z-index: 5;
        pointer-events: none;
        font-size: 11px;
        letter-spacing: 0.18em;
        line-height: 1.9;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.9s ease,
          transform 0.9s ease;
      }
      #trackinfo.show {
        opacity: 1;
        transform: none;
      }
      #tiRow {
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: none;
      }
      #albumArt {
        display: none; /* generated artwork stays available for Media Session / lockscreen, but not in the on-page UI */
      }
      #tiText {
        display: flex;
        flex-direction: column;
        min-width: 0;
        max-width: 100%;
      }
      #trackNumTime,
      #trackname,
      #trackmeta,
      #visitorline,
      #cypherline {
        max-width: 100%;
      }
      #trackNumTime {
        letter-spacing: 0.18em;
        white-space: nowrap;
      }
      #trackNumTime .tnNum {
        color: var(--support);
        font-size: 13px;
      }
      #trackNumTime .tnTime {
        color: var(--trackcyan);
        font-size: 13px;
      }
      #trackNumTime .tnSect {
        color: var(--support);
        font-size: 13px;
      }
      #trackname {
        color: var(--text);
        font-size: 13px;
        letter-spacing: 0.22em;
        pointer-events: auto;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none; /* long-press opens the engine room, not text selection */
      }
      #trackmeta {
        color: var(--trackcyan);
        white-space: nowrap;
      }
      #visitorline {
        color: var(--magenta);
        opacity: 0;
        transition: opacity 0.9s;
      }
      #visitorline.on {
        opacity: 1;
      }
      #cypherline {
        color: var(--lav);
        opacity: 0;
        transition: opacity 0.9s;
        letter-spacing: 0.28em;
        font-size: 10px;
        text-shadow: 0 0 10px var(--glow2);
        height: 0;
        overflow: hidden;
      }
      #cypherline.on {
        opacity: 0.95;
        height: auto;
      }
      #liveRecording {
        position: fixed;
        left: 50%;
        top: 28%;
        transform: translate(-50%, -8px);
        z-index: 8;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: clamp(10px, 2.4vw, 20px);
        opacity: 0;
        transition:
          opacity 0.28s ease,
          transform 0.28s ease;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: clamp(28px, 8.5vw, 76px);
        line-height: 1;
        letter-spacing: 0.12em;
        color: var(--livetext);
        text-shadow:
          0 0 12px rgba(255, 42, 54, 0.55),
          0 0 28px rgba(62, 232, 222, 0.18);
        white-space: nowrap;
        text-transform: uppercase;
      }
      #liveRecording.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #liveRecording .dot {
        width: clamp(13px, 3.8vw, 30px);
        height: clamp(13px, 3.8vw, 30px);
        border-radius: 50%;
        background: #ff2638;
        box-shadow:
          0 0 14px rgba(255, 38, 56, 0.95),
          0 0 32px rgba(255, 38, 56, 0.45);
        animation: liveblink 0.82s steps(1) infinite;
        flex: 0 0 auto;
      }
      #batteryScreen {
        position: fixed;
        left: 50%;
        top: 50%;
        z-index: 9;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.96);
        text-align: center;
        opacity: 0;
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      #batteryScreen.on {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      #battIcon {
        width: 74px;
        height: auto;
      }
      #batteryText {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        letter-spacing: 0.14em;
        font-size: 13px;
        color: var(--text);
        text-transform: uppercase;
      }
      #batterySub {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--support);
      }
      @keyframes liveblink {
        50% {
          opacity: 0.18;
        }
      }
      #memoryControl {
        position: fixed;
        left: 30px;
        bottom: 150px;
        z-index: 6;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
        pointer-events: none;
      }
      #memoryControl.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      #memoryBtn {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 1.5px solid var(--ratingempty);
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ratingempty);
        box-shadow: 0 0 10px
          color-mix(in srgb, var(--ratingempty) 18%, transparent);
        transition:
          color 0.22s ease,
          border-color 0.22s ease,
          box-shadow 0.22s ease,
          transform 0.15s ease;
      }
      @media (hover: hover) and (pointer: fine) {
        #memoryBtn:hover {
          color: var(--ratinggold-hover);
          border-color: var(--ratinggold-hover);
          box-shadow: 0 0 14px
            color-mix(in srgb, var(--ratinggold-hover) 34%, transparent);
        }
      }
      #memoryBtn.remembered {
        color: var(--ratinggold);
        border-color: var(--ratinggold);
        box-shadow: 0 0 16px
          color-mix(in srgb, var(--ratinggold) 48%, transparent);
      }
      #memoryBtn:active {
        transform: scale(0.92);
      }
      #memoryBtn:focus-visible {
        outline: 2px solid var(--purple);
        outline-offset: 4px;
      }
      #memoryBtn svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.55;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      #memoryBtn.remembered svg {
        fill: currentColor;
      }
      #gAri {
        cursor: pointer;
        outline: none;
      }
      #gAri:focus,
      #gAri:focus-visible {
        outline: none;
      }
      footer {
        position: fixed;
        right: 30px;
        top: 32px;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: flex-end;
        font-size: 9px;
        letter-spacing: 0.26em;
        color: var(--support);
        text-transform: uppercase;
        pointer-events: none;
      }
      footer .liveDot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: #ff2638;
        box-shadow: 0 0 4px rgba(255, 38, 56, 0.8);
        animation: slowblink 2.6s ease-in-out infinite;
      }
      @keyframes slowblink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.15;
        }
      }
      #themebtn {
        pointer-events: auto;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1.5px solid var(--cyan-dim);
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          border-color 0.3s,
          transform 0.15s;
      }
      #themebtn:hover {
        border-color: var(--cyan);
      }
      #themebtn:active {
        transform: scale(0.92);
      }
      #themebtn:focus-visible {
        outline: 2px solid var(--purple);
        outline-offset: 4px;
      }
      #themebtn svg {
        width: 11px;
        height: 11px;
        stroke: var(--cyan-dim);
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #themebtn.auto svg path.fillhalf {
        fill: var(--cyan-dim);
        stroke: none;
      }
      #chat {
        position: fixed;
        right: 30px;
        top: 110px;
        bottom: 110px;
        width: 236px;
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
        padding: 14px 14px 12px;
        opacity: 0;
        transition: opacity 1.4s ease;
      }
      #chat.on {
        opacity: 1;
      }
      #chatHead {
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--cyan-dim);
        animation: chatglow 2.8s ease-in-out infinite;
      }
      @keyframes chatglow {
        0%,
        100% {
          text-shadow: 0 0 3px var(--glow1);
          opacity: 0.65;
        }
        50% {
          text-shadow: 0 0 14px var(--glow1);
          opacity: 1;
        }
      }
      #chatLog {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 8px;
      }
      .chatMsg {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        line-height: 1.45;
        letter-spacing: 0.02em;
        color: var(--support);
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
        overflow-wrap: break-word;
      }
      .chatMsg.in {
        opacity: 0.85;
        transform: none;
      }
      .chatMsg .nick {
        margin-right: 6px;
      }
      @media (max-width: 1279px) {
        #chat {
          display: none;
        }
      }
      @media (max-width: 640px) {
        header {
          left: 18px;
          top: 18px;
        }
        #trackinfo {
          left: 18px;
          right: 18px;
          bottom: 18px;
          font-size: 10px;
        }
        #hint {
          left: 18px;
          right: 18px;
          top: auto;
          bottom: 11%;
          font-size: 10px;
          letter-spacing: 0.22em;
        }
        #memoryControl {
          left: 18px;
          bottom: 130px;
        }
        footer {
          right: 18px;
          top: 20px;
        }
        #themebtn {
          width: 18px;
          height: 18px;
        }
        #wxText {
          font-size: 11px;
        }
        header .tribute {
          font-size: 11px;
          max-width: 88vw;
        }
        .note {
          font-size: 30px;
        }
        .note.sp {
          font-size: 26px;
        }
        #liveRecording {
          top: 31%;
        }
        #stage {
          padding-top: 60px;
        }
        svg#scene {
          width: 104vw;
          height: 104vw;
          filter: drop-shadow(0 0 5px var(--glow1))
            drop-shadow(0 0 17px var(--glow2));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #hint {
          animation: none;
          opacity: 0.7;
        }
        .wxCond.wx-signal,
        .wxCond.wx-signal::before,
        .wxCond.wx-signal::after {
          animation: none !important;
        }
        .note.go {
          animation-duration: 0.01s;
        }
        .note.sleepz.go {
          animation-duration: 2.8s;
        }
      }

      /* ---------- dev inspector panel ---------- */
      .devpanel {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 60;
        width: 344px;
        max-width: 92vw;
        max-height: calc(100vh - 24px);
        max-height: calc(100svh - 24px);
        overflow: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        background: rgba(4, 5, 10, 0.96);
        border: 1px solid rgba(62, 232, 222, 0.35);
        border-radius: 10px;
        padding: 12px 14px 14px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        line-height: 1.5;
        color: #dfeef0;
        letter-spacing: 0.02em;
        box-shadow: 0 10px 44px rgba(0, 0, 0, 0.6);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        opacity: 0;
        transform: translateY(-6px);
        pointer-events: none;
        visibility: hidden;
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
      }
      .devpanel.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
        visibility: visible;
        transition-delay: 0s;
      }
      .devpanel::-webkit-scrollbar {
        width: 8px;
      }
      .devpanel::-webkit-scrollbar-thumb {
        background: rgba(62, 232, 222, 0.25);
        border-radius: 4px;
      }
      .devsticky {
        position: static;
        margin: 0 0 8px;
        padding: 0 0 8px;
        background: transparent;
        border-bottom: 1px solid #1a2230;
      }
      #devClose {
        flex: 0 0 auto;
        border: 0;
        background: transparent;
        color: #8fa3a8;
        font: inherit;
        font-size: 18px;
        line-height: 1;
        padding: 2px 0 2px 8px;
        cursor: pointer;
      }
      #devClose:hover {
        color: #ff5fd2;
      }
      #devClose:focus-visible {
        outline: 2px solid #a78bff;
        outline-offset: 3px;
      }
      /* energy sparkline in the dev panel */
      .ecurve {
        display: flex;
        align-items: flex-end;
        gap: 1px;
        height: 20px;
        margin: 6px 0 2px;
      }
      .ecurve i {
        flex: 1 1 0;
        min-width: 1px;
        background: rgba(62, 232, 222, 0.35);
      }
      .ecurve i.ec-now {
        background: #ff5fd2;
      }
      .ecurve i.ec-cut {
        background: rgba(255, 95, 210, 0.5);
      }
      @media (max-width: 640px) {
        .devpanel {
          top: 10px;
          right: 10px;
          width: calc(100vw - 20px);
          max-width: none;
          max-height: calc(100svh - 20px);
          padding-top: max(12px, env(safe-area-inset-top));
          padding-bottom: max(14px, env(safe-area-inset-bottom));
        }
      }
      .devhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        color: #3ee8de;
        letter-spacing: 0.18em;
        margin-bottom: 6px;
      }
      .devsticky .devname {
        margin-bottom: 0;
      }
      .devname {
        color: #dfeef0;
        margin-bottom: 6px;
        letter-spacing: 0.06em;
      }
      .devsec {
        border-top: 1px solid #1a2230;
        padding: 7px 0;
      }
      .devsec:last-child {
        padding-bottom: 0;
      }
      .devh {
        color: #a78bff;
        letter-spacing: 0.16em;
        font-size: 10px;
        margin-bottom: 4px;
      }
      .devh2 {
        color: #8fa3a8;
        letter-spacing: 0.02em;
      }
      .krow {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin: 1px 0;
      }
      .krow > span:first-child {
        color: #8fa3a8;
        width: 50px;
        flex: none;
      }
      .krow b {
        color: #3ee8de;
        font-weight: 500;
      }
      .kdim,
      .pdim {
        color: #5b6b73;
      }
      .prow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }
      .plab {
        color: #8fa3a8;
        width: 44px;
        flex: none;
      }
      .dgrid {
        display: inline-flex;
        gap: 2px;
      }
      .dstep {
        width: 13px;
        height: 13px;
        border-radius: 2px;
        background: #141b28;
        display: inline-block;
        box-sizing: border-box;
      }
      .dstep.beat {
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
      }
      .dstep.on.k {
        background: #3ee8de;
      }
      .dstep.on.s {
        background: #ff5fd2;
      }
      .dstep.on.g {
        background: #5e50a8;
      }
      .dstep.on.h {
        background: #a78bff;
      }
      .dstep.on.b {
        background: #b9a8ff;
      }
      .dstep.play {
        outline: 2px solid #fff;
        outline-offset: 1px;
      }
      .dflags {
        color: #5b6b73;
        margin-top: 5px;
      }
      .arrow {
        display: flex;
        gap: 8px;
        padding: 1px 0;
        color: #8fa3a8;
      }
      .arrow .arrnm {
        width: 58px;
        flex: none;
      }
      .arrow .arrbars {
        color: #5b6b73;
      }
      .arrow.now,
      .arrow.now .arrbars {
        color: #3ee8de;
      }
      .arrnow {
        color: #ff5fd2;
        margin-left: auto;
      }
      .prog {
        color: #3ee8de;
        letter-spacing: 0.06em;
      }
      .dnarow {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 1px 0;
      }
      .dnalab {
        width: 78px;
        flex: none;
        color: #8fa3a8;
      }
      .dnabar {
        flex: 1;
        height: 6px;
        background: #141b28;
        border-radius: 3px;
        overflow: hidden;
      }
      .dnabar > span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #3ee8de, #a78bff);
      }
      .dnaval {
        width: 20px;
        text-align: right;
        color: #dfeef0;
      }
      #devChatBuffer {
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-width: 0;
        max-height: min(42vh, 420px);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding-right: 4px;
        scroll-behavior: smooth;
      }
      #devChatBuffer::-webkit-scrollbar {
        width: 7px;
      }
      #devChatBuffer::-webkit-scrollbar-thumb {
        background: rgba(62, 232, 222, 0.22);
        border-radius: 4px;
      }
      .devChatMsg {
        display: block;
        min-width: 0;
        line-height: 1.48;
        overflow-wrap: anywhere;
        word-break: normal;
      }
      .devChatName {
        display: inline;
        margin-right: 7px;
        font-weight: 500;
        white-space: normal;
      }
      .devChatText {
        display: inline;
        color: #dfeef0;
        font-weight: 400;
      }
      .devnone {
        color: #5b6b73;
      }

      body.light .devpanel {
        background: rgba(248, 250, 252, 0.97);
        border-color: rgba(11, 156, 147, 0.35);
        color: #16202a;
      }
      body.light .devpanel::-webkit-scrollbar-thumb,
      body.light #devChatBuffer::-webkit-scrollbar-thumb {
        background: rgba(11, 156, 147, 0.24);
      }
      body.light .devsticky,
      body.light .devsec {
        border-color: #d9dee6;
      }
      body.light .devhead,
      body.light .krow b,
      body.light .arrow.now,
      body.light .arrow.now .arrbars,
      body.light .prog {
        color: #0a7a72;
      }
      body.light .devname,
      body.light .dnaval,
      body.light .devChatText {
        color: #16202a;
      }
      body.light .devh {
        color: #7452e8;
      }
      body.light .devh2,
      body.light .krow > span:first-child,
      body.light .plab,
      body.light .arrow {
        color: #5c6672;
      }
      body.light .kdim,
      body.light .pdim,
      body.light .dflags,
      body.light .arrow .arrbars,
      body.light .devnone {
        color: #8b94a3;
      }
      body.light .dstep,
      body.light .dnabar {
        background: #d9dee6;
      }
      body.light .dstep.beat {
        box-shadow: inset 0 0 0 1px rgba(22, 32, 42, 0.08);
      }
      body.light .dstep.play {
        outline-color: #16202a;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <svg id="scene" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff5fd2" />
            <stop offset="1" stop-color="#3ee8de" />
          </linearGradient>
        </defs>
        <g id="world"></g>
        <g id="gReverse" style="display: none"></g>
      </svg>
    </div>

    <header>
      <h1>
        <a
          href="https://github.com/nachtaap/A.R.I./blob/main/README.md"
          target="_blank"
          rel="noopener"
          >A.R.I.</a
        >
      </h1>
      <p>AUDIOLOGICAL&nbsp;ROAMING&nbsp;INTELLIGENCE</p>
      <p class="tribute">inspired by ARIatHOME · version 99</p>
      <div id="wxText" aria-hidden="true">
        <span id="wxClock"></span><span id="wxWeather"></span><br />
        <span id="wxBattery"></span>
      </div>
    </header>

    <footer>
      <span class="liveDot"></span>
      <span>live from the grid</span>
      <button id="themebtn" aria-label="cycle theme: auto, light, dark">
        <svg viewBox="0 0 24 24"><g id="thicon"></g></svg>
      </button>
    </footer>

    <div id="hint">tap A.R.I. to catch the street signal</div>

    <aside id="chat" aria-hidden="true">
      <div id="chatHead">street chat</div>
      <div id="chatLog"></div>
    </aside>

    <section id="audienceFocus" aria-hidden="true">
      <div id="audienceFocusHead"><b>LIVE CHAT</b><span id="audienceFocusStats"></span></div>
      <div id="audienceFocusLog"></div>
    </section>

    <div id="trackinfo" style="display: none">
      <div id="tiRow">
        <img id="albumArt" alt="" width="56" height="56" />
        <div id="tiText">
          <div id="trackNumTime"></div>
          <div id="trackname"></div>
          <div id="trackmeta"></div>
        </div>
      </div>
      <div id="visitorline"></div>
      <div id="cypherline">A cypher is forming</div>
    </div>

    <div id="followBubble" aria-hidden="true">
      <div id="followBubbleText"></div>
    </div>

    <div id="liveRecording" aria-hidden="true">
      <span class="dot"></span><span>LIVE RECORDING</span>
    </div>

    <div id="batteryScreen" aria-hidden="true">
      <svg id="battIcon" viewBox="0 0 64 30">
        <rect
          x="1"
          y="1"
          width="56"
          height="28"
          rx="5"
          fill="none"
          stroke="var(--cyan)"
          stroke-width="2"
        />
        <rect x="58" y="9" width="5" height="12" rx="1.5" fill="var(--cyan)" />
        <rect
          id="battFill"
          x="5"
          y="5"
          width="0"
          height="20"
          rx="2"
          fill="var(--cyan)"
        />
      </svg>
      <div id="batteryText">A.R.I. IS SWAPPING BATTERIES</div>
      <div id="batterySub"></div>
    </div>

    <div id="memoryControl" aria-label="remember this track">
      <button
        id="memoryBtn"
        aria-label="remember this track"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 20.2 4.6 13.1C1.6 10.2 2 5.5 5.4 3.7c2.2-1.2 4.9-.6 6.6 1.3 1.7-1.9 4.4-2.5 6.6-1.3 3.4 1.8 3.8 6.5.8 9.4Z"
          />
        </svg>
      </button>
    </div>

    <script>
      /* SAM (Software Automatic Mouth) - (c) Christian Schiffler, MIT - https://github.com/discordier/sam */
      /**
       * This is SamJs.js v0.3.0
       *

      const S = 34,

      // circle lying flat on a horizontal plane (z const)
      function circTop(cx, cy, z, r, cls, n = 26) {
        const a = [];
        for (let i = 0; i < n; i++) {
          const t = (i / n) * Math.PI * 2;
          a.push([cx + r * Math.cos(t), cy + r * Math.sin(t), z]);
        }
        return poly(a, cls);
      }
      // circle on a vertical plane facing +x (x const)
      function circX(x, cy, cz, r, cls, n = 26) {
        const a = [];
        for (let i = 0; i < n; i++) {
          const t = (i / n) * Math.PI * 2;
          a.push([x, cy + r * Math.cos(t), cz + r * Math.sin(t)]);

        return poly(a, cls);
      }
      // circle on a vertical plane facing +y (y const)

        const a = [];
        for (let i = 0; i < n; i++) {

          [x2, y1, z2],
          [x2, y2, z2],
          [x1, y2, z2],
        ];

          [x2, y1, z2],
          [x2, y2, z2],
          [x2, y2, z1],
          [x2, y1, z1],
        ];

          [x1, y2, z2],
          [x2, y2, z2],
          [x2, y2, z1],
          [x1, y2, z1],
        ];

          [
            [x1, y1, z2],
            [x2, y1, z2],
          ],
          [
            [x2, y1, z2],
            [x2, y2, z2],
          ],
          [
            [x2, y2, z2],
            [x1, y2, z2],
          ],
          [
            [x1, y2, z2],
            [x1, y1, z2],
          ],
          [
            [x2, y1, z2],
            [x2, y1, z1],
          ],
          [
            [x2, y2, z2],
            [x2, y2, z1],
          ],
          [
            [x1, y2, z2],
            [x1, y2, z1],
          ],
          [
            [x2, y1, z1],
            [x2, y2, z1],
          ],
          [
            [x2, y2, z1],
            [x1, y2, z1],
          ],
        ];

          poly(top, "occface") +

          [x2, y2, z2],
          [x2, y2, z1],
          [x2, y1, z1],

          [x2, y2, z2],
          [x2, y2, z1],
          [x1, y2, z1],

        const edges = [
          [
            [x2, y1, z2],
            [x2, y1, z1],
          ],
          [
            [x2, y2, z2],
            [x2, y2, z1],
          ],
          [
            [x1, y2, z2],
            [x1, y2, z1],
          ],
          [
            [x2, y1, z1],
            [x2, y2, z1],
          ],
          [
            [x2, y2, z1],
            [x1, y2, z1],
          ],

          out += seg(a, b, cls);

      // coiled cable between two 3D points, drawn in screen space with sag

        }
        return color;
      }

      function cryptoRandom() {
        if (globalThis.crypto?.getRandomValues) {
          const n = new Uint32Array(1);
          crypto.getRandomValues(n);
          return n[0] / 4294967296;
        }
        return Math.random();
      }

      function randomRange(min, max) {
        return min + cryptoRandom() * (max - min);
      }

      function makeRole(hue, saturation, darkL = 68, lightL = 34) {
        return {
          dark: contrastSafeHsl(
            hue,
            saturation,
            darkL,
            ARI_DARK_BG,
            4.5,
            true,
          ),
          light: contrastSafeHsl(
            hue,
            saturation,
            lightL,
            ARI_LIGHT_BG,
            4.5,
            false,
          ),
          darkDim: contrastSafeHsl(
            hue,
            Math.max(34, saturation - 18),
            46,
            ARI_DARK_BG,
            3,
            true,
          ),
          lightDim: contrastSafeHsl(
            hue,
            Math.max(28, saturation - 24),
            52,
            ARI_LIGHT_BG,
            3,
            false,
          ),
        };
      }

      function generateAriOutfit() {
        const baseHue = Math.floor(randomRange(0, 360));
        const direction = cryptoRandom() < 0.5 ? -1 : 1;

        // A split-complementary skeleton with small random deviations keeps
        // palettes varied but coherent and prevents all roles collapsing into
        // one colour family.
        const hues = {
          body: baseHue,
          speakers: baseHue + direction * randomRange(72, 108),
          gear: baseHue - direction * randomRange(82, 128),
          rig: baseHue + 150 + randomRange(-18, 18),
          light: baseHue + direction * randomRange(28, 52),
          detail: baseHue + 180 + randomRange(-22, 22),
        };

        const roles = {
          body: makeRole(hues.body, randomRange(70, 92), 70, 32),
          speakers: makeRole(hues.speakers, randomRange(68, 90), 69, 33),
          gear: makeRole(hues.gear, randomRange(66, 88), 70, 34),
          rig: makeRole(hues.rig, randomRange(72, 94), 69, 33),
          light: makeRole(hues.light, randomRange(42, 68), 79, 31),
          detail: makeRole(hues.detail, randomRange(76, 96), 68, 34),
        };

        const keyHue = wrapHue(baseHue + randomRange(-12, 12));
        const keyDark = contrastSafeHsl(
          keyHue,
          randomRange(5, 16),
          92,
          ARI_DARK_BG,
          7,
          true,
        );
        const keyLight = contrastSafeHsl(
          keyHue,
          randomRange(5, 16),
          18,
          ARI_LIGHT_BG,
          7,
          false,
        );
        const keyDimDark = contrastSafeHsl(
          keyHue,
          randomRange(8, 20),
          58,
          ARI_DARK_BG,
          3.5,
          true,
        );
        const keyDimLight = contrastSafeHsl(
          keyHue,
          randomRange(8, 20),
          56,
          ARI_LIGHT_BG,
          3.5,
          false,
        );

        return {
          name: `procedural-${baseHue}`,
          dark: {
            body: roles.body.dark,
            bodyDim: roles.body.darkDim,
            speakers: roles.speakers.dark,
            gear: roles.gear.dark,
            gearDim: roles.gear.darkDim,
            rig: roles.rig.dark,
            rigDim: roles.rig.darkDim,
            light: roles.light.dark,
            detail: roles.detail.dark,
            key: keyDark,
            keyDim: keyDimDark,
          },
          light: {
            body: roles.body.light,
            bodyDim: roles.body.lightDim,
            speakers: roles.speakers.light,
            gear: roles.gear.light,
            gearDim: roles.gear.lightDim,
            rig: roles.rig.light,
            rigDim: roles.rig.lightDim,
            light: roles.light.light,
            detail: roles.detail.light,
            key: keyLight,
            keyDim: keyDimLight,
          },
        };
      }

      const ariOutfit = generateAriOutfit();

      function applyAriOutfit(lightMode) {
        const p = lightMode ? ariOutfit.light : ariOutfit.dark;
        const vars = {
          "--cyan": p.body,
          "--cyan-dim": p.bodyDim,
          "--blue": p.speakers,
          "--purple": p.gear,
          "--purple-dim": p.gearDim,
          "--orange": p.rig,
          "--orange-dim": p.rigDim,
          "--lav": p.light,
          "--magenta": p.detail,
          "--key": p.key,
          "--key-dim": p.keyDim,
          "--glow1": `color-mix(in srgb, ${p.body} 45%, transparent)`,
          "--glow2": `color-mix(in srgb, ${p.gear} 18%, transparent)`,
        };
        Object.entries(vars).forEach(([key, value]) =>
          gAri.style.setProperty(key, value),
        );
        gAri.dataset.outfit = ariOutfit.name;
      }

      const gArmLup = document.getElementById("gArmLup");
      const gArmR = document.getElementById("gArmR");
      const gVis = document.getElementById("gVisitor");
      const gVis2 = document.getElementById("gVisitor2");
      const sfxA = document.getElementById("sfxA"),
        sfxB = document.getElementById("sfxB");
      const sfxC = document.getElementById("sfxC"),
        sfxD = document.getElementById("sfxD");

      /* ---------- random visitor generator ---------- */
      const VIS_DARK = [
        "#ff5fd2",
        "#ffb84d",
        "#8dff96",
        "#5fb0ff",
        "#fff45f",
        "#ff7a6b",
      ];
      const VIS_LIGHT = [
        "#d6219c",
        "#d97a12",
        "#15913f",
        "#2457d6",
        "#b0890a",
        "#d63a3a",
      ];
      const visPalette = () =>
        document.body.classList.contains("light") ? VIS_LIGHT : VIS_DARK;
      let vis1 = null,
        vis2 = null;
      function buildVisitor(target, instr, dx) {
        const col = pick(visPalette());
        const accent = pick(visPalette().filter((c) => c !== col)); // hair/accessory gets its own color
        const ext = (e, p, f) => [
          e[0] + (p[0] - e[0]) * f,
          e[1] + (p[1] - e[1]) * f,
          e[2] + (p[2] - e[2]) * f,
        ]; // lengthen forearm beyond elbow
        const archetypes = [
          {
            kind: "cap",
            voiceKind: "neutral",
            stance: 0.0,
            lean: 0.0,
            shoulderRise: 0.0,
            hemSkew: 0.0,
          },
          {
            kind: "masc",
            voiceKind: "masc",
            stance: 0.05,
            lean: 0.06,
            shoulderRise: -0.04,
            hemSkew: 0.03,
          },
          {
            kind: "femme",
            voiceKind: "femme",
            stance: -0.05,
            lean: -0.05,
            shoulderRise: 0.05,
            hemSkew: -0.03,
          },
        ];
        const arche = pick(archetypes);
        const h = R(0.86, 1.14); // height variation
        const bodyW = R(0.78, 1.28); // build: slender to broad, independent of height
        const fl = R(0.02, 0.16); // restrained hoodie flare
        const sway = R(-0.03, 0.03); // tiny per-visitor jitter so clones are avoided
        const stance = arche.stance + sway;
        const lean = arche.lean + sway * 0.6;
        const shoulderRise = arche.shoulderRise;
        const hemSkew = arche.hemSkew + sway * 0.5;
        const legT = 3.08 * h,
          bodT = 5.34 * h,
          headZ = 6.08 * h;
        const leftHandX = 0.34 + dx - lean * 0.18,
          rightHandX = 1.58 + dx - lean * 0.12;
        const headCX = 0.95 + dx + lean * 0.28;
        let v = "",
          notePos,
          micPh = 0;
        const VS = 1.28 * R(0.97, 1.03); // visitor scale: ~90% of A.R.I.'s height
        const ax = 0.95 + dx,
          ay = -1.05; // ground anchor to scale around
        const T = (p) => [
          ax + (p[0] - ax) * VS * bodyW,
          ay + (p[1] - ay) * VS * bodyW,
          p[2] * VS,
        ];
        const vseg = (a, b, c) => seg(T(a), T(b), c);
        const vpline = (a, c) => pline(a.map(T), c);
        const vpoly = (a, c) => poly(a.map(T), c);
        const vbez = (a, mm, b, c) => bez(T(a), T(mm), T(b), c);
        const vcircY = (y, cx, cz, r, c) => {
          const q = T([cx, y, cz]);
          return circY(q[1], q[0], q[2], r * VS, c);
        };
        const vcircTop = (cx, cy, z, r, c) => {
          const q = T([cx, cy, z]);
          return circTop(q[0], q[1], q[2], r * VS, c);
        };
        /* coiled cable: plugged into the left input of the rig, running to the performing hand */
        const isMicVis = !(
          instr === "on acoustic" ||
          instr === "on electric" ||
          instr === "on flute" ||
          instr === "on violin" ||
          instr === "on e-violin" ||
          instr === "on sax"
        );
        const cableHand = isMicVis
          ? [0.9 + dx + lean * 0.16, -0.55, 5.55 * h]
          : [0.55 + dx - stance * 0.18, -0.9, 4.3 * h];
        v += seg([1.2, 1.3, 4.22], [1.6, 1.3, 4.22], "p"); // jack
        v += coil([1.6, 1.3, 4.22], T(cableHand), dx < 0 ? 9 : 7, 6, 24, "p");
        const lpA = iso(...T([0.6 + dx - stance * 0.6, -1.05, legT])),
          lpB = iso(...T([1.3 + dx + stance * 0.6, -1.05, legT]));
        v +=
          `<g class="wlegA" data-px="${lpA[0].toFixed(1)}" data-py="${lpA[1].toFixed(1)}">` +
          vseg(
            [0.55 + dx - stance, -1.0, 0],
            [0.6 + dx - stance * 0.6, -1.05, legT],
            "v",
          ) +
          vseg(
            [0.57 + dx - stance, -1.02, 0],
            [0.57 + dx - stance, -0.82, 0],
            "v",
          ) +
          "</g>";
        v +=
          `<g class="wlegB" data-px="${lpB[0].toFixed(1)}" data-py="${lpB[1].toFixed(1)}">` +
          vseg(
            [1.37 + dx + stance, -1.02, 0],
            [1.37 + dx + stance, -0.82, 0],
            "v",
          ) +
          vseg(
            [1.35 + dx + stance, -1.0, 0],
            [1.3 + dx + stance * 0.6, -1.05, legT],
            "v",
          ) +
          "</g>";
        v += vpoly(
          [
            [0.25 + dx, -1.1, legT],
            [1.65 + dx, -1.1, legT],
            [1.65 + fl + dx + lean, -1.1, bodT + shoulderRise],
            [
              0.25 - fl + dx + lean * 0.35 + hemSkew,
              -1.1,
              bodT - shoulderRise * 0.45,
            ],
          ],
          "v",
        );
        v += vcircY(-1.1, headCX, headZ + shoulderRise * 0.25, 0.58, "v");

        /* hair that lives under the gear — never the same colour as the headgear */
        const age = Math.random() < 0.18 ? "older" : "adult"; // now and then an elder of the block steps up
        const hairCol =
          age === "older"
            ? "#98a2ab"
            : pick(visPalette().filter((c) => c !== col && c !== accent));
        if (arche.kind === "masc") {
          v += '<g style="color:' + hairCol + '">';
          v += vseg(
            [0.48 + dx + lean * 0.14, -1.1, headZ + 0.1],
            [0.48 + dx + lean * 0.14, -1.1, headZ - 0.01],
            "v",
          );
          v += vseg(
            [1.42 + dx + lean * 0.14, -1.1, headZ + 0.1],
            [1.42 + dx + lean * 0.14, -1.1, headZ - 0.01],
            "v",
          );
          v += "</g>";
        }
        if (arche.kind === "femme") {
          v += '<g style="color:' + hairCol + '">';
          v += vbez(
            [0.4 + dx + lean * 0.1, -1.1, headZ + 0.05],
            [0.14 + dx + lean * 0.14, -1.1, headZ - 0.5],
            [0.46 + dx + lean * 0.16, -1.1, headZ - 1.02],
            "v",
          );
          v += vbez(
            [1.5 + dx + lean * 0.1, -1.1, headZ + 0.05],
            [1.76 + dx + lean * 0.14, -1.1, headZ - 0.5],
            [1.44 + dx + lean * 0.16, -1.1, headZ - 1.02],
            "v",
          );
          v += "</g>";
        }
        /* street headgear — drawn in screen space on the PROJECTED head ellipse, so it always hugs the skull.
     the head circle lives in the world XZ plane; on screen that is an ellipse with axes HU (world +x)
     and HV (world +z). crown of the projected ellipse sits at ~117°. */
        const hcp = iso(...T([headCX, -1.1, headZ + shoulderRise * 0.25]));
        const hrw = 0.58 * VS; // vcircY scales the head radius by VS only
        const HU = [IA * hrw, IB * hrw],
          HV = [0, -S * hrw],
          HW = [-IA * hrw, IB * hrw]; // HW = facing direction (viewer-left)
        const hpt = (th, sc) => [
          hcp[0] + (Math.cos(th) * HU[0] + Math.sin(th) * HV[0]) * sc,
          hcp[1] + (Math.cos(th) * HU[1] + Math.sin(th) * HV[1]) * sc,
        ];
        const P2 = (q) => q[0].toFixed(1) + " " + q[1].toFixed(1);
        const harc = (a0, a1, sc, n) => {
          let d = "";
          for (let i = 0; i <= n; i++) {
            d +=
              (i ? "L " : "M ") + P2(hpt(a0 + ((a1 - a0) * i) / n, sc)) + " ";
          }
          return d;
        };
        const DG = Math.PI / 180;
        const basic = Math.random() < 0.3; // some guests keep it plain — no gear, no extras
        const gear = basic
          ? "none"
          : pick(
              age === "older"
                ? ["bucket", "beanie", "none", "none", "snapback"]
                : [
                    "snapback",
                    "snapback",
                    "backwards",
                    "beanie",
                    "bucket",
                    "none",
                  ],
            );
        v += '<g style="color:' + accent + '">';
        if (gear === "snapback" || gear === "backwards") {
          const back = gear === "backwards";
          const tilt = R(-16, 20) * DG; // worn low over the eyes, straight, or pushed back
          const a0 = (back ? 26 : 28) * DG + tilt,
            a1 = (back ? 156 : 154) * DG + tilt; // hand-tuned via accessoire-tuner
          const csc = back ? 1.1 : 1.15;
          v += '<path class="vcapfill" d="' + harc(a0, a1, csc, 10) + 'Z"/>';
          v += '<path class="v" d="' + harc(a0, a1, csc, 10) + 'Z"/>';
          const b0 = hpt((back ? 30 : 147) * DG + tilt, back ? 1.06 : 1.07);
          const bl = (back ? 0.78 : 0.86) * IA * hrw,
            bth = (back ? 0.06 : 0.08) * S * hrw;
          const bd0 = back ? [1, 0.69] : [-1, -0.44]; // base brim direction, rotated along with the tilt
          const cs = Math.cos(-tilt),
            sn = Math.sin(-tilt);
          const b1 = [
            b0[0] + (bd0[0] * cs - bd0[1] * sn) * bl,
            b0[1] + (bd0[0] * sn + bd0[1] * cs) * bl,
          ];
          v +=
            '<polygon class="vsolid" points="' +
            P2(b0) +
            " " +
            P2(b1) +
            " " +
            P2([b1[0], b1[1] + bth]) +
            " " +
            P2([b0[0], b0[1] + bth]) +
            '"/>';
        } else if (gear === "beanie") {
          v +=
            '<path class="vcapfill" d="' +
            harc(26 * DG, 156 * DG, 1.12, 10) +
            'Z"/>';
          v +=
            '<path class="v" d="' + harc(26 * DG, 156 * DG, 1.12, 10) + 'Z"/>';
          const c0 = hpt(26 * DG, 1.12),
            c1 = hpt(156 * DG, 1.12),
            cup = 0.16 * S * hrw; // fold-over cuff
          v +=
            '<line class="v" x1="' +
            c0[0].toFixed(1) +
            '" y1="' +
            (c0[1] - cup).toFixed(1) +
            '" x2="' +
            c1[0].toFixed(1) +
            '" y2="' +
            (c1[1] - cup).toFixed(1) +
            '"/>';
        } else if (gear === "bucket") {
          const t1 = hpt(114 * DG, 1.59),
            t2 = hpt(64 * DG, 1.59); // sloped flat top
          const s1 = hpt(144 * DG, 1.02),
            s2 = hpt(31 * DG, 1.02); // crown meets brim
          const extL = 0.47 * IA * hrw,
            extR = 0.41 * IA * hrw,
            dropL = -0.02 * S * hrw,
            dropR = 0.49 * S * hrw,
            brimCurve = 0.12;
          const bL = [s1[0] - extL, s1[1] + dropL],
            bR = [s2[0] + extR, s2[1] + dropR];
          const bMid = [
            (bL[0] + bR[0]) / 2,
            (bL[1] + bR[1]) / 2 + brimCurve * S * hrw,
          ];
          const bd =
            "M " +
            P2(bL) +
            " L " +
            P2(s1) +
            " L " +
            P2(t1) +
            " L " +
            P2(t2) +
            " L " +
            P2(s2) +
            " L " +
            P2(bR) +
            " Q " +
            P2(bMid) +
            " " +
            P2(bL) +
            " Z";
          v +=
            '<path class="vcapfill" d="' +
            bd +
            '"/>' +
            '<path class="v" d="' +
            bd +
            '"/>';
        } else if (arche.kind !== "cap") {
          // bare head still gets a hairline crown
          v +=
            '<path class="vcapfill" d="' +
            harc(17 * DG, 158 * DG, 1.05, 10) +
            'Z"/>';
          v +=
            '<path class="v" style="color:' +
            hairCol +
            '" d="' +
            harc(17 * DG, 158 * DG, 1.05, 10) +
            '"/>';
        }
        if (!basic && Math.random() < (age === "older" ? 0.2 : 0.35)) {
          // shades: frame, lens and shape all vary
          const fCol = pick([
            accent,
            "#e8eef2",
            "#f7c948",
            "#c9d3da",
            pick(visPalette()),
          ]); // frame colour
          const lCol =
            Math.random() < 0.5
              ? fCol
              : pick(visPalette().filter((c) => c !== fCol)); // lens colour
          const open = Math.random() < 0.4; // open frame (bg lens) vs solid lens
          const st =
            'style="' +
            (open ? "fill:var(--bg)" : "fill:" + lCol) +
            ";stroke:" +
            fCol +
            ';stroke-width:1.3;stroke-linejoin:round"';
          const fr =
            'style="stroke:' + fCol + ';stroke-width:1.3;stroke-linecap:round"';
          const sth = 0.28 * S * hrw,
            ear = hpt(33 * DG, 1.06);
          const S0 = [
            hcp[0] - 0.43 * HW[0],
            hcp[1] - 0.43 * HW[1] + 0.09 * S * hrw,
          ]; // wraparound visor — hand-tuned via accessoire-tuner
          const S1 = [
            hcp[0] + 0.97 * HW[0],
            hcp[1] + 0.97 * HW[1] - 1.29 * S * hrw,
          ];
          v +=
            "<line " +
            fr +
            ' x1="' +
            S0[0].toFixed(1) +
            '" y1="' +
            (S0[1] + sth * 0.4).toFixed(1) +
            '" x2="' +
            ear[0].toFixed(1) +
            '" y2="' +
            ear[1].toFixed(1) +
            '"/>';
          v +=
            "<polygon " +
            st +
            ' points="' +
            P2(S0) +
            " " +
            P2(S1) +
            " " +
            P2([S1[0], S1[1] + sth]) +
            " " +
            P2([S0[0], S0[1] + sth]) +
            '"/>';
        }
        v += "</g>";
        if (age === "older") {
          // silver beard along the jaw, under the chin
          const bo = harc(209 * DG, 334 * DG, 1.43, 8),
            bi = harc(334 * DG, 209 * DG, 0.7, 8).replace("M", "L");
          v +=
            '<g style="color:#98a2ab"><path class="v" style="fill:#98a2ab" d="' +
            bo +
            bi +
            'Z"/></g>'; // solid silver beard
        }
        if (!basic && Math.random() < 0.22) {
          // chain: metal, drop, strands and pendant all vary
          const metal = pick([
            "#f7c948",
            "#f7c948",
            "#c9d3da",
            "#e8c9a0",
            "#f0a58f",
          ]); // gold x2, silver, pale gold, rose gold
          const ccx = 0.95 + dx + lean * 0.3,
            dip = R(0.55, 0.95);
          v += '<g style="color:' + metal + '">';
          v += vbez(
            [0.5 + dx + lean * 0.3, -1.1, bodT - 0.06],
            [ccx, -1.1, bodT - 0.25 - dip],
            [1.4 + dx + lean * 0.3, -1.1, bodT - 0.06],
            "v",
          );
          if (Math.random() < 0.25)
            v += vbez(
              [0.58 + dx + lean * 0.3, -1.1, bodT - 0.06],
              [ccx, -1.1, bodT - 0.2 - dip * 0.55],
              [1.32 + dx + lean * 0.3, -1.1, bodT - 0.06],
              "v",
            ); // double strand
          const pend = pick([
            "circle",
            "circle",
            "diamond",
            "triangle",
            "bar",
            "none",
          ]);
          if (pend !== "none") {
            const pcls = Math.random() < 0.55 ? "vsolid" : "v"; // solid metal or outline
            const pr = (2.4 + R(0, 1.8)) * VS;
            const pp = iso(
              ...T([ccx, -1.1, bodT - 0.06 - (0.19 + dip) / 2 - 0.02]),
            );
            const py = pp[1] + pr * 1.1; // hangs just under the chain's dip
            if (pend === "circle")
              v +=
                '<circle class="' +
                pcls +
                '" cx="' +
                pp[0].toFixed(1) +
                '" cy="' +
                py.toFixed(1) +
                '" r="' +
                pr.toFixed(1) +
                '"/>';
            else if (pend === "diamond")
              v +=
                '<polygon class="' +
                pcls +
                '" points="' +
                P2([pp[0], py - pr]) +
                " " +
                P2([pp[0] + pr * 0.8, py]) +
                " " +
                P2([pp[0], py + pr]) +
                " " +
                P2([pp[0] - pr * 0.8, py]) +
                '"/>';
            else if (pend === "triangle")
              v +=
                '<polygon class="' +
                pcls +
                '" points="' +
                P2([pp[0] - pr, py - pr * 0.7]) +
                " " +
                P2([pp[0] + pr, py - pr * 0.7]) +
                " " +
                P2([pp[0], py + pr]) +
                '"/>';
            else
              v +=
                '<polygon class="' +
                pcls +
                '" points="' +
                P2([pp[0] - pr * 1.2, py - pr * 0.4]) +
                " " +
                P2([pp[0] + pr * 1.2, py - pr * 0.4]) +
                " " +
                P2([pp[0] + pr * 1.2, py + pr * 0.4]) +
                " " +

        if (instr === "on acoustic" || instr === "on electric") {

          if (instr === "on acoustic")
            v += vcircY(-1.0, 1.25 + dx, 3.55 * h, 0.15, "v"); // sound hole
          else {
            v += vseg(
              [1.05 + dx, -1.0, 3.45 * h],

              "v",
            ); // pickups
            v += vseg(
              [1.05 + dx, -1.0, 3.7 * h],
              [1.45 + dx, -1.0, 3.6 * h],
              "v",
            );
